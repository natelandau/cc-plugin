---
# https://pre-commit.com
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit, manual]
fail_fast: true
repos:
  - repo: "https://github.com/commitizen-tools/commitizen"
    rev: v4.19.3
    hooks:
      - id: commitizen

  - repo: "https://github.com/pre-commit/pygrep-hooks"
    rev: v1.10.0
    hooks:
      - id: python-check-mock-methods
      - id: python-no-eval
      - id: python-no-log-warn
      - id: python-use-type-annotations
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal
      - id: text-unicode-replacement-char

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
        exclude: .devcontainer/|.vscode/
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace
        types: [python]
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        types: [python]

  - repo: "https://github.com/adhtruong/mirrors-typos"
    rev: v1.51.1
    hooks:
      - id: typos
        args: ["--force-exclude"]
        stages: [commit-msg]

  - repo: "https://github.com/python-jsonschema/check-jsonschema"
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]

  - repo: "https://github.com/gitleaks/gitleaks"
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: "https://github.com/crate-ci/committed"
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]

  - repo: "https://github.com/tsvikas/sync-with-uv"
    rev: v0.6.0
    hooks:
      - id: sync-with-uv

  # Hooks that run a duty share its gate-cache markers, so a gate that already passed
  # on this tree (from the terminal, an agent, or an earlier hook) skips at once.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run duty ruff
        language: system
        pass_filenames: false
        types: [python]

      - id: format
        name: ruff format
        entry: uv run duty format
        language: system
        pass_filenames: false
        types: [python]

      - id: ty
        name: ty
        entry: uv run duty ty
        language: system
        pass_filenames: false
        types: [python]

      - id: typos
        name: typos
        entry: uv run duty typos
        language: system
        pass_filenames: false

      - id: yamllint
        name: yamllint
        entry: uv run duty yamllint
        language: system
        pass_filenames: false
        files: ^.*\.(yaml|yml)$

      - id: shellcheck
        name: shellcheck
        entry: uv run duty shellcheck
        language: system
        pass_filenames: false
        types: [shell]

      - id: pytest
        name: pytest
        entry: uv run duty test
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]
        files: |
          (?x)^(
          plugins/|
          tests/|
          uv\.lock|
          pyproject\.toml
          )

      # Workaround until commitizen fixes its commitizen-branch hook (see commitizen #1923).
      # The upstream hook's args contain the literal "$PRE_COMMIT_FROM_REF..$PRE_COMMIT_TO_REF",
      # but no client (pre-commit, prek) substitutes those placeholders, and `cz check` doesn't
      # expand them either, so git receives them verbatim and fails with "ambiguous argument".
      # Wrapping the call in `bash -c` forces the shell to expand the env vars prek/pre-commit
      # do set. Remove this block once commitizen ships a fix upstream.
      - id: commitizen-branch
        name: commitizen check branch
        entry: bash -c 'uv run --quiet cz check --rev-range "$PRE_COMMIT_FROM_REF..$PRE_COMMIT_TO_REF"' --
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
